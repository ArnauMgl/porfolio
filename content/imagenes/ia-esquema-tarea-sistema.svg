<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">La productividad de una tarea frente a la del sistema</title>
<desc id="d">Esquema con dos barras horizontales. La primera, «La tarea: una persona, con IA», dura 10 minutos para generar un prototipo. La segunda, «El sistema: el equipo, hasta que el trabajo llega al usuario», dura unos dos días de trabajo, unas 16 horas, y se divide en generar (10 minutos), revisar, corregir y dejarlo listo para el usuario. La barra del sistema es casi cien veces más larga que la de la tarea. Es un ejemplo ilustrativo.</desc>
<rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>
<text x="80.0" y="150.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#111111">La tarea</text>
<text x="80.0" y="196.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#6B6B6B">Una persona, con IA</text>
<rect x="80" y="236" width="15" height="80" fill="#F7BD03" stroke="#111111" stroke-width="2"/>
<text x="122.0" y="292.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="40" fill="#111111">10 minutos</text>
<text x="348.1" y="292.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="34" fill="#6B6B6B">para generar el prototipo</text>
<text x="80.0" y="440.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#111111">El sistema</text>
<text x="80.0" y="486.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#6B6B6B">El equipo, hasta que el trabajo llega al usuario</text>
<rect x="80" y="526" width="15" height="80" fill="#F7BD03" stroke="#111111" stroke-width="2"/>
<rect x="95" y="526" width="475" height="80" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="332.5" y="578.0" text-anchor="middle" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="600" font-size="34" fill="#111111">Revisar</text>
<rect x="570" y="526" width="475" height="80" fill="#E2E2E2" stroke="#111111" stroke-width="2"/>
<text x="807.5" y="578.0" text-anchor="middle" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="600" font-size="34" fill="#111111">Corregir</text>
<rect x="1045" y="526" width="475" height="80" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="1282.5" y="578.0" text-anchor="middle" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="600" font-size="34" fill="#FFFFFF">Dejarlo listo para el usuario</text>
<line x1="87" y1="606" x2="87" y2="642" stroke="#111111" stroke-width="2"/>
<text x="80.0" y="680.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="600" font-size="30" fill="#111111">Generar · 10 minutos</text>
<line x1="80" y1="724" x2="1520" y2="724" stroke="#111111" stroke-width="2"/>
<line x1="80" y1="714" x2="80" y2="734" stroke="#111111" stroke-width="2"/>
<line x1="1520" y1="714" x2="1520" y2="734" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="782.0" text-anchor="middle" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="38" fill="#111111">≈ 2 días de trabajo del equipo (unas 16 horas)</text>
<text x="80.0" y="900.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#6B6B6B">Ejemplo ilustrativo. Generar y el total están a escala: 10 minutos frente a 2 días de trabajo.</text>
<text x="80.0" y="940.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#6B6B6B">El reparto entre revisar, corregir y dejarlo listo es orientativo.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>