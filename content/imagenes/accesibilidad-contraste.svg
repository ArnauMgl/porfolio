<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">El mismo texto en dos grises sobre fondo blanco</title>
<desc id="d">Comparación del mismo texto en dos grises sobre fondo blanco. A la izquierda, un gris claro con un contraste de 2,4:1, que no cumple las WCAG. A la derecha, un gris más oscuro con un contraste de 7,0:1, que sí las cumple. El mínimo para texto normal es 4,5:1.</desc>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF"/>
<text x="80.0" y="100.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#111111">El mismo texto, dos grises</text>
<text x="80.0" y="148.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#6B6B6B">Sobre fondo blanco. Para texto normal, las WCAG piden al menos 4,5:1</text>
<rect x="80" y="200" width="680" height="640" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="280.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#111111">Correo electrónico</text>
<text x="120.0" y="350.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="33" fill="#A6A6A6">Te enviaremos un enlace para entrar</text>
<text x="120.0" y="410.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="33" fill="#A6A6A6">Sin contraseñas ni registros</text>
<line x1="120" y1="470" x2="720" y2="470" stroke="#E2E2E2" stroke-width="1"/>
<text x="120.0" y="570.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="96" fill="#111111">2,4:1</text>
<rect x="120" y="620" width="330" height="64" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
<polyline fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round" points="145.0,641.0 167.0,663.0"/>
<polyline fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round" points="145.0,663.0 167.0,641.0"/>
<text x="186.0" y="664.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#111111">No cumple</text>
<text x="120.0" y="780.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#6B6B6B">Gris #A6A6A6</text>
<rect x="840" y="200" width="680" height="640" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="880.0" y="280.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#111111">Correo electrónico</text>
<text x="880.0" y="350.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="33" fill="#595959">Te enviaremos un enlace para entrar</text>
<text x="880.0" y="410.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="33" fill="#595959">Sin contraseñas ni registros</text>
<line x1="880" y1="470" x2="1480" y2="470" stroke="#E2E2E2" stroke-width="1"/>
<text x="880.0" y="570.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="96" fill="#111111">7,0:1</text>
<rect x="880" y="620" width="250" height="64" rx="4" fill="#111111" stroke="#111111" stroke-width="3"/>
<polyline fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" points="904.0,652.0 913.0,662.0 929.0,642.0"/>
<text x="946.0" y="664.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF">Cumple</text>
<text x="880.0" y="780.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="#6B6B6B">Gris #595959</text>
<text x="80.0" y="910.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#6B6B6B">Ejemplos de texto secundario: la ayuda de un campo, la letra pequeña, una fecha.</text>
