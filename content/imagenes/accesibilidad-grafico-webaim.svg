<text x="80.0" y="100.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#111111">Páginas de inicio con fallos WCAG detectables</text>
<text x="80.0" y="148.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#6B6B6B">Porcentaje del millón de páginas que WebAIM analiza cada año</text>
