<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Evolución del porcentaje de páginas de inicio con fallos WCAG detectables (2019–2026)</title>
<desc id="d">Gráfico de líneas con el porcentaje de páginas de inicio con fallos WCAG detectables según WebAIM: 97,8 % en 2019, 98,1 % en 2020, 97,4 % en 2021, 96,8 % en 2022, 96,3 % en 2023, 95,9 % en 2024, 94,8 % en 2025 y 95,9 % en 2026. Sube un poco en 2020, baja poco a poco hasta 2025 y en 2026 vuelve a subir. El eje vertical empieza en el 92 %.</desc>
