<text x="80.0" y="966.0" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#6B6B6B">El eje vertical empieza en el 92 %, para que se vea el cambio.</text>
